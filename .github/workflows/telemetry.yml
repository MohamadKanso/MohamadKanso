name: Refresh telemetry

on:
  schedule:
    - cron: "30 1 * * *"   # daily at 01:30 UTC (after the 3D calendar)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**"]

concurrency:
  group: telemetry
  cancel-in-progress: true

jobs:
  telemetry:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render telemetry.svg from the GitHub API
        run: node scripts/telemetry.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/v2/telemetry.svg
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Refresh telemetry [skip ci]"
          git pull --rebase origin main
          git push
